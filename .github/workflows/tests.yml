name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported, and the board's own (Debian 13).
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # With the versions the board runs - see constraints.txt.
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: pytest

  # The browser tests (tests/ui): a real LocalHome started from a throwaway
  # config, driven by a real Chromium - the pages at phone and desktop
  # widths, names that would break careless HTML, two phones on one
  # schedule. Left out of the job above (`pytest` skips the `ui` marker).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,ui]" -c constraints.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m ui

  # The README's "try it in one minute": the demo image builds, starts with
  # every device simulated, and shows two zones with their sample week.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.demo.yml up -d --build
      - run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:5000/api/server-time > /dev/null && break
            sleep 2
          done
          curl -fs http://localhost:5000/api/climate/zones | python3 -c "
          import json, sys
          zones = json.load(sys.stdin)['zones']
          assert [z['name'] for z in zones] == ['Rooms', 'Bathrooms'], zones
          assert zones[0]['target_c'] is not None, 'the sample week is loaded'
          print('demo up:', [(z['name'], z['temperature_c']) for z in zones])"
          curl -fs http://localhost:5000/climate-admin > /dev/null
      - if: always()
        run: docker compose -f docker-compose.demo.yml logs --tail 50
      - run: docker compose -f docker-compose.demo.yml down -v
