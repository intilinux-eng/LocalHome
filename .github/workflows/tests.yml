name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tplink extra too, so the TP-Link driver's tests run here (it's
      # optional for users - GPL, see THIRD_PARTY_NOTICES.md).
      - run: pip install -e ".[dev,tplink]"
      - run: pytest
