<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalHome</title>
  <link rel="stylesheet" href="app.css">
</head>
<!-- The compact window: the house at a glance, the VMC and the shutters a tap
     away, a zone's charts a click away. Everything it knows comes from the
     board's API, passed on by the program around it (MainForm.cs). -->
<body>
  <!-- The two tabs: the house for living in it, the plant for checking it. -->
  <nav class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" id="tab-house" data-tab="house" aria-selected="true" aria-controls="house-view"><i class="ic" aria-hidden="true">&#xE80F;</i><span id="tab-house-text"></span></button>
    <button type="button" role="tab" id="tab-plant" data-tab="plant" aria-selected="false" aria-controls="plant"><i class="ic" aria-hidden="true">&#xE9D9;</i><span id="tab-plant-text"></span><b class="tab-badge" id="tab-plant-badge" hidden></b></button>
  </nav>
  <div class="shell" id="house-view" role="tabpanel">
    <div class="house">
      <header class="top">
        <div class="brand"><b id="brand"></b><p id="say"></p></div>
        <div class="top-right">
          <div class="top-line">
            <span class="health" id="health" data-level="unknown"><i></i><span id="health-text"></span></span>
            <button class="gear" type="button" id="size" hidden><i class="ic widen" aria-hidden="true">&#xE740;</i><i class="ic narrow" aria-hidden="true">&#xE73F;</i></button>
            <button class="gear" type="button" id="settings" hidden><i class="ic" aria-hidden="true">&#xE713;</i></button>
          </div>
          <button class="chip" type="button" id="away-chip" hidden></button>
        </div>
      </header>
      <ul class="alerts" id="alerts" role="status" hidden></ul>
      <main id="body">
        <section class="card away" id="away" hidden></section>
        <section class="zones" id="zones"></section>
        <section class="facts" id="facts"></section>
        <section class="card" id="dehum" hidden></section>
        <section class="card vmc" id="vmc" hidden></section>
        <section class="card covers" id="covers" hidden></section>
      </main>
      <p class="note" id="note" role="status" hidden></p>
      <footer class="foot">
        <span id="updated"></span>
        <a href="#" id="open-full" data-open="/"></a>
      </footer>
    </div>
    <!-- A zone, outside or the power over time (charts.js): instead of the
         house in a narrow window, beside it in a wide one. -->
    <aside class="detail" id="detail">
      <div class="detail-head" id="detail-head"></div>
      <div class="range" id="detail-range"></div>
      <div class="detail-body" id="detail-body"></div>
    </aside>
  </div>
  <!-- The plant (plant.js): each device's state and the main settings, read only. -->
  <main class="plant" id="plant" role="tabpanel" aria-labelledby="tab-plant" hidden>
    <div class="plant-hero" id="plant-hero"></div>
    <div class="tiles" id="plant-tiles"></div>
    <div class="plant-grid">
      <section class="plant-card" id="plant-devices"></section>
      <section class="plant-card plant-config" id="plant-config"></section>
    </div>
  </main>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <script src="texts.js"></script>
  <script src="charts.js"></script>
  <script src="plant.js"></script>
  <script src="app.js"></script>
</body>
</html>
