<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.climate_admin.page_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='climate_admin.css') }}">
</head>
<body>
  <header>
    <h1>{{ t.climate_admin.page_title }}</h1>
    <div class="header-right">
      <a class="icon-btn-sm" href="/" title="{{ t.climate_admin.back_to_dashboard }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </a>
    </div>
  </header>

  <p class="hint-text">{{ t.climate_admin.intro }}</p>

  <div class="section-head">
    <h2>{{ t.climate_admin.broker_heading }}</h2>
  </div>
  <p class="hint-text">{{ t.climate_admin.broker_note }}</p>
  <p id="broker-status" class="admin-broker-status"></p>

  <div class="section-head">
    <h2>{{ t.climate_admin.zones_heading }}</h2>
  </div>
  <p class="hint-text">{{ t.climate_admin.zones_note }}</p>
  <div id="zone-forms"></div>

  <button class="tbtn open" id="save-btn" onclick="saveMap()">{{ t.climate_admin.save_button }}</button>
  <p class="hint-text" id="save-result"></p>

  <div class="section-head" style="margin-top:32px">
    <h2>{{ t.climate_admin.status_heading }}</h2>
    <div class="toolbar">
      <button class="range-btn" onclick="refreshAll()">{{ t.climate_admin.refresh_button }}</button>
    </div>
  </div>
  <p class="hint-text">{{ t.climate_admin.status_note }}</p>
  <div id="status-list"></div>

  <script>
    window.I18N = {{ t | tojson }};
  </script>
  <script src="{{ url_for('static', filename='climate_admin.js') }}"></script>
</body>
</html>
