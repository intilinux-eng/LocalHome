<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalHome</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>LocalHome</h1>
    <div id="summary"></div>
  </header>

  <div id="sensor-cards" class="dashboard-grid"></div>

  <section>
    <div class="section-head">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="3" y1="11" x2="21" y2="11"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
        Covers
      </h2>
      <div class="toolbar">
        <button class="tbtn open" onclick="sendCoverAction('all', 'open')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
          Open all
        </button>
        <button class="tbtn close" onclick="sendCoverAction('all', 'close')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          Close all
        </button>
      </div>
    </div>
    <div id="cover-cards" class="shutters-grid"></div>
  </section>

  <script>
    window.COVER_NAMES = {{ cover_names | tojson }};
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
