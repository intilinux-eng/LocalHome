# LocalHome - climate only, Shelly devices only.
#
# For an apartment where LocalHome runs just the heating/cooling. There
# are no devices in this file on purpose: every one is already listed in
# the admin panel (http://<board>.local:5000/climate-admin), to configure
# by its Shelly id - the two zones, Stanze and Bagni (H&T sensor + relay
# valve), the bathroom bypass valve, the dehumidifier, the outdoor sensor
# and the VMC.
#
#   cp config/config.climate.example.yaml config/config.yaml
#   cp config/mqtt_broker.example.json config/mqtt_broker.json   # "host": "localhost"
#
# A device that isn't installed, switched off or unreachable is never a
# problem for the rest: its card shows it, the admin panel's system
# status lists it, and the thermostat simply leaves that zone alone -
# closing its valve after `sensor_failsafe_hours` without a reading.
# See docs/deployment.md#a-new-apartment-climate-only.

web:
  host: "0.0.0.0"
  port: 5000
  language: "it"

# Nothing here: the admin panel adds the Shelly devices.
integrations: []

thermostat:
  # The season a fresh install starts in - after that it's switched from
  # the admin panel's Season section and remembered in schedules.json.
  mode: "heat"
  # Matches the Shelly H&T Gen3's own 0.5°C reporting step.
  hysteresis_c: 0.5
  schedules_file: "schedules.json"
  poll_interval_seconds: 60
  # No reading from a zone's sensor for this long: its valve is closed.
  sensor_failsafe_hours: 24
  # The bypass valve and the dehumidifier entered in the admin panel get
  # their season rules there (Extra switches -> Behaviour per season):
  # by default the bypass is on in summer and off in winter, the
  # dehumidifier yours to switch in summer and off in winter. Writing a
  # rule here instead (`season_rules`, see docs/configuration.md) takes
  # precedence and makes the panel's read-only.

positions_file: "positions.json"
history:
  db_file: "data/history.db"
  poll_interval_seconds: 30
  retention_days: 30
  # Hard ceiling on the history database, on top of retention_days: over
  # it, the oldest days go first. A sensor that's off adds nothing.
  max_db_mb: 300
