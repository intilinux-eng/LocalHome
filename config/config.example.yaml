# LocalHome configuration.
#
#   cp config/config.example.yaml config/config.yaml
#   cp config/mqtt_broker.example.json config/mqtt_broker.json   # "host": "localhost"
#
# As it is, this is what a new board starts with: the climate of the home
# LocalHome was built for - two zones, Stanze and Bagni (an H&T sensor and
# a relay valve each), the bathroom bypass valve, the dehumidifier, the
# outdoor sensor and the VMC - each Shelly to configure by its id in the
# admin panel (http://<board>.local:5000/climate-admin), one at a time.
# None of them is written here.
#
# Further down, commented out, what a home may have beside the climate:
# uncomment what yours has. config.yaml is gitignored - your real setup
# never gets published. Every option: docs/configuration.md. A relative
# path in this file is read from this file's own directory (config/).
#
# A device that isn't installed, switched off or unreachable is never a
# problem for the rest: its card shows it, the admin panel's system
# status lists it, and the thermostat simply leaves that zone alone -
# closing its valve after `sensor_failsafe_hours` without a reading.

web:
  host: "0.0.0.0"
  port: 5000
  # The pages' language: "it" or "en".
  language: "it"
  # Optional HTTP Basic Auth, off by default (a trusted LAN is assumed) -
  # read docs/configuration.md#web-auth-optional first.
  # auth:
  #   secrets_file: "secrets_web.json"

# The climate's Shellys are added in the admin panel, not here. Each entry
# below is a device beside them; its card shows on the home page only
# once it's here. Sensors, relays and dimmers of other brands that speak
# JSON over MQTT: docs/integrations/mqtt.md.
integrations:
  # Tuya roller shutters (LoraTap modules, say): one entry loads every one
  # found in devices_file - see docs/integrations/tuya.md.
  # - kind: cover
  #   type: tuya_curtain_switch
  #   devices_file: "devices.json"

  # The house's power, from a Sonoff POWCT through the eWeLink cloud - see
  # docs/integrations/ewelink.md, and `energy:` below.
  # - kind: power_meter
  #   type: ewelink_powct
  #   name: "Home Power Meter"
  #   devices_file: "ewelink_devices.json"
  #   secrets_file: "secrets_ewelink.json"

  # A Meross smartplug, switched and measured through the Meross cloud -
  # see docs/integrations/meross.md.
  # - kind: switch
  #   type: meross_plug
  #   name: "Desk Plug"
  #   devices_file: "meross_devices.json"
  #   secrets_file: "secrets_meross.json"

thermostat:
  # The season a fresh install starts in - after that it's switched from
  # the admin panel's Season section and remembered in schedules.json.
  mode: "heat"
  # Matches the Shelly H&T Gen3's own 0.5 °C reporting step.
  hysteresis_c: 0.5
  schedules_file: "schedules.json"
  poll_interval_seconds: 60
  # A zone's sensor unreachable this long (it is after 4 hours without a
  # report): its valve is closed - 7 hours after its last report in all.
  # Longer would leave a radiant panel open blind for a day.
  sensor_failsafe_hours: 3
  # The bypass valve and the dehumidifier entered in the admin panel get
  # their season rules there (Extra switches -> Behaviour per season):
  # by default the bypass is on in summer and off in winter, the
  # dehumidifier yours to switch in summer and off in winter. Writing a
  # rule here instead (`season_rules`, see docs/configuration.md) takes
  # precedence and makes the panel's read-only.

# With the power meter above: its tile on the home page turns amber when
# the house draws more than it can indefinitely, red near the trip.
# contract_limit_w is your contract's or your breaker's.
# energy:
#   sensor: "Home Power Meter"
#   contract_limit_w: 3000

positions_file: "positions.json"
history:
  db_file: "data/history.db"
  poll_interval_seconds: 30
  retention_days: 30
  # Hard ceiling on the history database, on top of retention_days: over
  # it, the oldest days go first. A sensor that's off adds nothing.
  max_db_mb: 300
