[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localhome"
version = "0.1.0"
description = "A local-first, no-cloud-required framework for small smart-home setups: roller shutters, power meters, climate sensors, smart plugs and alerts, talked to over your LAN wherever possible."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "tinytuya>=1.13",
    "aiohttp>=3.9",
    "meross-iot>=0.4",
    "requests>=2.31",
    "PyYAML>=6.0",
    "paho-mqtt>=2.0",
    # arduino-router (the UNO Q's Linux-to-MCU bridge) speaks msgpack-RPC -
    # for the LED matrix, see services/led_matrix.py.
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The browser tests (tests/ui, `pytest -m ui`) - also needs
# `python -m playwright install chromium` once.
ui = ["playwright>=1.40"]
# GPL-3.0-or-later, unlike every other dependency here - opt-in on
# purpose, see THIRD_PARTY_NOTICES.md#a-note-on-python-kasa-specifically
tplink = ["python-kasa>=0.7"]

[project.scripts]
localhome = "localhome.web.app:main"
localhome-cli = "localhome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"localhome.web" = ["templates/*.html", "static/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The browser tests need Playwright and a Chromium and take a minute or
# two: left out of a plain `pytest`, run with `pytest -m ui`.
addopts = "-m 'not ui'"
markers = ["ui: drives a real browser against a real server (tests/ui)"]
