[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localhome"
version = "1.0.0"
description = "A local-first, no-cloud-required framework for small smart-home setups: roller shutters, power meters, climate sensors, smart plugs and alerts, talked to over your LAN wherever possible."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }

# What LocalHome works with, up to the next major version - one that may
# change what LocalHome relies on (0.x versions: the next minor). The
# exact versions tested together are in constraints.txt; install with it.
dependencies = [
    "flask>=3.0,<4",
    "waitress>=3.0,<4",
    "tinytuya>=1.13,<2",
    "aiohttp>=3.9,<4",
    "meross-iot>=0.4,<0.5",
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "paho-mqtt>=2.0,<3",
    # arduino-router (the UNO Q's Linux-to-MCU bridge) speaks msgpack-RPC -
    # for the LED matrix, see services/led_matrix.py.
    "msgpack>=1.0,<2",
]

[project.optional-dependencies]
# pytest-xdist runs the tests in parallel: `pytest -n auto`.
dev = ["pytest>=8.0,<10", "pytest-xdist>=3.6,<4"]
# The browser tests (tests/ui, `pytest -m ui`) - also needs
# `python -m playwright install chromium` once.
ui = ["playwright>=1.40,<2"]
# tools/deploy_board.py, on the PC only - never installed on the board.
deploy = ["paramiko>=3.0,<6"]

[project.scripts]
localhome = "localhome.web.app:main"
localhome-cli = "localhome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"localhome.web" = ["templates/*.html", "static/*", "static/guide/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The browser tests need Playwright and a Chromium and take a minute or
# two: left out of a plain `pytest`, run with `pytest -m ui`.
addopts = "-m 'not ui'"
markers = [
    "ui: drives a real browser against a real server (tests/ui)",
    "enduser: the end-user suite - the home page used as a resident would (tests/ui/test_end_user.py)",
]
